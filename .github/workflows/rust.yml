on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

name: Rust

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-targets
  
  cargo-sort:
    name: Check Cargo.toml sorting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: perf-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install cargo-sort
        run: cargo install cargo-sort
      
      - name: Check Cargo.toml formatting
        run: cargo sort --check --workspace --grouped --order package,workspace,lints,profile,bin,benches,dependencies,dev-dependencies,features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test

      - name: Run cargo test with bucket resize feature
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --features test-bucket-resize
        env:
          NUM_DATA_BUCKETS: 2
          BUCKET_RESIZE_LOAD_FACTOR_PCT: 1

      - name: Run random stress test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: -p salt --features test-bucket-resize test_e2e_random_stress -- --ignored --nocapture
        env:
          NUM_DATA_BUCKETS: 2
          BUCKET_RESIZE_LOAD_FACTOR_PCT: 80
          RANDOM_KV_POOL_SIZE: 4096
          RANDOM_ITERATIONS: 100
          RANDOM_BLOCKS: 3
          RANDOM_MINI_BLOCKS: 10
          RANDOM_OPS: 100
          RANDOM_LOOKUPS: 50

  # banderwagon's vector paths run only on a CPU with AVX-512 IFMA, and their tests return early
  # on one without it, so the suite above passes without exercising them on such a runner.
  # This job runs the suite on a host that has the extension and fails if the host does not.
  test-avx512-ifma:
    name: Test Suite (AVX-512 IFMA)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Require AVX-512 IFMA
        run: |
          grep -m 1 "model name" /proc/cpuinfo
          grep -qw avx512f /proc/cpuinfo && grep -qw avx512ifma /proc/cpuinfo || {
            echo "::error::this runner has no AVX-512 IFMA, so the vector paths would go untested"
            exit 1
          }

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test

  test-no-std:
    name: Test no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          target: riscv64imac-unknown-none-elf

      - name: Run cargo check for no_std target
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: -p salt --target riscv64imac-unknown-none-elf --no-default-features

      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --no-default-features

      - name: Run cargo test with bucket resize feature
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --no-default-features --features test-bucket-resize

  test-i686:
    name: Test i686
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: i686-unknown-linux-gnu

      - name: Install 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # `usize` is 32 bits here. At MAX_BUCKET_SIZE a subtree-local node number
      # exceeds u32, so a node id narrowed to `usize` only goes wrong on a target
      # like this one; the 64-bit test job passes either way.
      - name: Run cargo test on i686
        run: cargo test --target i686-unknown-linux-gnu

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets -- -D warnings
