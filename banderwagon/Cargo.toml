[package]
name = "banderwagon"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
# set by cargo-llvm-cov on a nightly toolchain
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
# an `unsafe fn` spells out each unsafe operation in it, as a safe function does
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# every `unsafe` block says why it is sound
undocumented_unsafe_blocks = "warn"

[dependencies]
ark-ec = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695", default-features = false }
ark-ed-on-bls12-381-bandersnatch = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695", default-features = false }
ark-ff = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695", default-features = false }
ark-serialize = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695", default-features = false }
salt-macros = { path = "../salt-macros", default-features = false }

rayon = { version = "*", optional = true }
[dev-dependencies]
hex = "0.4.3"
rand_chacha = "0.3.1"

[features]
default = ["parallel"]
std = [
    "ark-ed-on-bls12-381-bandersnatch/std",
    "ark-ff/std",
    "ark-ec/std",
    "ark-serialize/std",
]
parallel = [
    "std",
    "dep:rayon",
    "salt-macros/parallel",
    "ark-ff/parallel",
    "ark-ff/asm",
    "ark-ec/parallel",
]
